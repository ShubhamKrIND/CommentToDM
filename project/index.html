<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"DM Sans"', 'system-ui', 'sans-serif'] },
        colors: {
          brand: { 50: '#f6f8ff', 100: '#eef2ff', 500: '#3657D5', 600: '#2f4cc1', 900: '#04103B' },
          ink:   { 900: '#04103B', 800: '#1F2937', 700: '#374151', 600: '#4B5563', 500: '#6B7280', 400: '#9CA3AF' },
          line:  { DEFAULT: '#F1F1F1', soft: '#ebeefb' },
          surf:  { soft: '#F9FAFB' },
        },
        boxShadow: {
          soft: '0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.04)',
          card: '0 8px 28px rgba(16, 24, 40, 0.08)',
          lift: '0 18px 40px -18px rgba(54, 87, 213, 0.35)',
        },
        borderRadius: { '4xl': '28px' },
      }
    }
  }
</script>
<style>
  html, body { font-family: 'DM Sans', system-ui, sans-serif; color: #1F2937; background: #fff; }
  ::selection { background: #d8dffa; color: #04103B; }
  /* Subtle ambient grid behind hero */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(54,87,213,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(54,87,213,.06) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, #000 50%, transparent 80%);
  }
  /* Marquee */
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .marquee-track { animation: marquee 38s linear infinite; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(8px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* Pulse dot for "live" */
  @keyframes livepulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(46,110,40,.35);} 50% { box-shadow: 0 0 0 6px rgba(46,110,40,0); } }
  .live-dot { animation: livepulse 1.6s ease-out infinite; }

  /* Bell shake */
  @keyframes bellshake {
    0% { transform: rotate(0); } 15% { transform: rotate(14deg); } 30% { transform: rotate(-10deg); }
    45% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } 100% { transform: rotate(0); }
  }
  .bell-shake { animation: bellshake .9s ease-in-out 1; transform-origin: 50% 0; }

  /* DM slide in */
  @keyframes dmIn { from { opacity: 0; transform: translate(12px, 8px) scale(.98); } to { opacity: 1; transform: none; } }
  .dm-in { animation: dmIn .55s cubic-bezier(.2,.7,.2,1) both; }

  /* Caret blink */
  @keyframes blink { 50% { opacity: 0; } }
  .caret { display: inline-block; width: 1px; height: 1em; background: currentColor; margin-left: 1px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }

  /* Hover lift */
  .lift { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .lift:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(16,24,40,.18); }

  /* Section heading wash */
  .eyebrow { letter-spacing: .14em; }

  /* Comparison row pop on stagger */
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row-in { animation: rowIn .5s ease both; }

  /* Soft accent dot pattern */
  .dots {
    background-image: radial-gradient(rgba(54,87,213,.18) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  /* Smooth scrolling for in-page anchors */
  html { scroll-behavior: smooth; }

  /* For details/summary accordion */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .25s ease; }

  /* Tab content fade */
  .tab-enter { animation: tabIn .35s ease both; }
  @keyframes tabIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Step circle ring */
  .ring-active { box-shadow: 0 0 0 4px rgba(54,87,213,.12); }

  /* Avoid layout shift on font swap */
  body { font-synthesis-weight: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
